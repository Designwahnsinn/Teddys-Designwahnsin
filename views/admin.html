<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mitarbeiter-Bereich – Teddys Designwahnsinn</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/admin.css">
</head>
<body>
  <main>
    <div class="admin-header">
      <h1>Mitarbeiter-Bereich</h1>
      <form class="logout-form" action="/mitarbeiter/logout" method="POST">
        <button type="submit">Abmelden</button>
      </form>
    </div>

    <div class="dashboard-grid">
      <a class="dashboard-card" href="/mitarbeiter/neu">
        <span class="icon">🆕</span>
        <h2>Design hochladen</h2>
        <p>Neues Design mit Bild, Kategorie und Preis anlegen</p>
      </a>
      <a class="dashboard-card" href="/mitarbeiter/designs">
        <span class="icon">🖼️</span>
        <h2>Designs verwalten</h2>
        <p>Bestehende Designs bearbeiten, Status ändern, löschen</p>
      </a>
      <a class="dashboard-card" href="/mitarbeiter/kategorien">
        <span class="icon">🏷️</span>
        <h2>Kategorien verwalten</h2>
        <p>Kategorien anlegen, umbenennen oder löschen</p>
      </a>
    </div>
  </main>
</body>
</html>
