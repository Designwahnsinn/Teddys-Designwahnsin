<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kategorien verwalten – Teddys Designwahnsinn</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/admin.css">
</head>
<body>
  <main>
    <div class="admin-header">
      <div>
        <a class="admin-nav-link" href="/mitarbeiter/upload">← Dashboard</a>
        <h1>Kategorien verwalten</h1>
      </div>
      <div class="admin-header-actions">
        <form class="logout-form" action="/mitarbeiter/logout" method="POST">
          <button type="submit">Abmelden</button>
        </form>
      </div>
    </div>

    <div class="category-manager">
      <div class="category-list" id="category-list"></div>
      <div class="category-add">
        <input type="text" id="new-category-name" placeholder="Neue Kategorie…">
        <button type="button" id="add-category-btn" class="save-btn">Hinzufügen</button>
      </div>
      <p id="category-message"></p>
    </div>
  </main>

  <script src="/admin-kategorien.js"></script>
</body>
</html>
