<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Design hochladen – Teddys Designwahnsinn</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/admin.css">
</head>
<body>
  <main>
    <div class="admin-header">
      <div>
        <a class="admin-nav-link" href="/mitarbeiter/upload">← Dashboard</a>
        <h1>Design hochladen</h1>
      </div>
      <div class="admin-header-actions">
        <form class="logout-form" action="/mitarbeiter/logout" method="POST">
          <button type="submit">Abmelden</button>
        </form>
      </div>
    </div>

    <form class="upload-form" id="upload-form">
      <div>
        <label for="name">Name</label>
        <input type="text" id="name" name="name" required>
      </div>
      <div>
        <label for="category">Kategorie</label>
        <select id="category" name="category" required></select>
      </div>
      <div>
        <label for="description">Beschreibung</label>
        <textarea id="description" name="description" rows="2"></textarea>
      </div>
      <div>
        <label for="price">Preis (€)</label>
        <input type="number" id="price" name="price" step="0.01" min="0">
      </div>
      <div>
        <label for="status">Status</label>
        <select id="status" name="status">
          <option value="verfügbar">verfügbar</option>
          <option value="exklusiv">exklusiv</option>
          <option value="verkauft">verkauft</option>
        </select>
      </div>
      <div>
        <label for="kaufLink">Kauf-Link (optional, z.B. Gumroad)</label>
        <input type="url" id="kaufLink" name="kaufLink" placeholder="https://…">
      </div>
      <div>
        <label for="instagramLink">Instagram-Link (optional)</label>
        <input type="url" id="instagramLink" name="instagramLink" placeholder="https://instagram.com/p/…">
      </div>
      <div>
        <label for="driveLink">Google-Drive-Link zur Originaldatei (intern)</label>
        <input type="url" id="driveLink" name="driveLink" placeholder="https://drive.google.com/…">
        <p class="field-hint">Nur im Mitarbeiter-Bereich sichtbar, nicht auf der Website.</p>
      </div>
      <div>
        <label for="image">Vorschaubild (PNG, JPG, WEBP, AVIF)</label>
        <input type="file" id="image" name="image" accept="image/png,image/jpeg,image/webp,image/avif" required>
      </div>
      <button type="submit">Design hochladen</button>
      <p id="form-message"></p>
    </form>
  </main>

  <script src="/admin-neu.js"></script>
</body>
</html>
