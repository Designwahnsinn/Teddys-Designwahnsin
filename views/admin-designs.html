<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Designs verwalten – Teddys Designwahnsinn</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/admin.css">
</head>
<body>
  <main>
    <div class="admin-header">
      <div>
        <a class="admin-nav-link" href="/mitarbeiter/upload">← Dashboard</a>
        <h1>Designs verwalten</h1>
      </div>
      <div class="admin-header-actions">
        <form class="logout-form" action="/mitarbeiter/logout" method="POST">
          <button type="submit">Abmelden</button>
        </form>
      </div>
    </div>

    <div class="design-toolbar">
      <div class="design-filters">
        <select id="filter-category"></select>
        <select id="filter-online">
          <option value="alle">Alle (online + offline)</option>
          <option value="online">Nur online</option>
          <option value="offline">Nur offline</option>
        </select>
        <select id="sort-designs">
          <option value="neueste">Neueste zuerst</option>
          <option value="kategorie">Nach Kategorie</option>
          <option value="name">Nach Name (A-Z)</option>
        </select>
      </div>
      <div class="bulk-toolbar" id="bulk-toolbar" hidden>
        <span id="bulk-count"></span>
        <button type="button" id="bulk-online">Online schalten</button>
        <button type="button" id="bulk-offline">Offline schalten</button>
        <button type="button" id="bulk-delete" class="delete-btn">Löschen</button>
      </div>
    </div>

    <p class="admin-empty" id="admin-empty" hidden>Keine Designs in dieser Ansicht.</p>
    <div class="admin-cards" id="admin-cards"></div>
  </main>

  <script src="/admin-designs.js"></script>
</body>
</html>
